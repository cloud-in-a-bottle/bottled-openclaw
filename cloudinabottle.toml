[app]
name = "openclaw"
version = "1.1.0"
description = "OpenClaw AI assistant"

[runtime.container]
image = "Dockerfile"
# Cloud in a Bottle pulls this signed prebuilt image (built from the release tag's commit by CI) instead of building
# `image`. If you fork this app and change it, comment this line out so your instance builds `image` instead.
prebuilt_image = "registry.cloudinabottle.org/bottled-openclaw"
port = 18789

[routing]
health_check = "/healthz"

[resources]
memory_mb = 2048
cpu_cores = 1.0

[data]
app_data = true

[[services.v2.consumes]]
service = "github.com/imbue-openhost/openhost/services/secrets"
shortname = "secrets"
version = ">=0.1.0"
grants = [
    { key = "ANTHROPIC_API_KEY" },
]
