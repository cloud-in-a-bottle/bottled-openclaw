[app]
name = "openclaw"
version = "0.1.0"
description = "OpenClaw AI assistant"

[runtime.container]
image = "Dockerfile"
port = 18789

[routing]
health_check = "/healthz"

[resources]
memory_mb = 2048
cpu_cores = 1.0

[data]
app_data = true

[[services.v2.consumes]]
service = "github.com/imbue-openhost/openhost/services/secrets"
shortname = "secrets"
version = ">=0.1.0"
grants = [
    { key = "ANTHROPIC_API_KEY" },
]
